name: "brasileirao"
version: "0.1.0"
config-version: 2

profile: "brasileirao"

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Diretorio da raw layer, resolvido a partir da raiz do repo.
  raw_dir: "../data/raw"
  # Janela usada nas features de forma recente.
  form_window: 5

models:
  brasileirao:
    +materialized: table
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
