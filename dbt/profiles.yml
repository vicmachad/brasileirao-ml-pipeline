# Profile versionado no repo: DuckDB e um arquivo local, nao ha segredo aqui.
# Rode com DBT_PROFILES_DIR=dbt (ver Makefile).
brasileirao:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/warehouse/brasileirao.duckdb') }}"
      threads: 4
      extensions:
        - httpfs
        - parquet

    ci:
      # No CI usamos um banco efemero, reconstruido do zero a cada run.
      type: duckdb
      path: "../data/warehouse/ci.duckdb"
      threads: 2
      extensions:
        - parquet

    seed:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/warehouse/brasileirao.duckdb') }}"
      threads: 4
      extensions:
        - httpfs
        - parquet

    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'workspace') }}"
      schema: "{{ env_var('DATABRICKS_SCHEMA', 'brasileirao') }}"
      threads: 4
