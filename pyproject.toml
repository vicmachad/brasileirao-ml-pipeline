[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brasileirao-ml-pipeline"
version = "0.1.0"
description = "Pipeline de dados e ML ponta a ponta sobre o Brasileirao Serie A"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Victor Machado", email = "victorhpmachado@gmail.com" }]

dependencies = [
    "requests>=2.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "mlflow>=2.14",
    "typer>=0.12",
]

[project.optional-dependencies]
dbt = ["dbt-core>=1.8,<2.0", "dbt-duckdb>=1.8,<2.0"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "responses>=0.25",
]

[project.scripts]
brasileirao = "brasileirao.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/brasileirao"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
