[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brasileirao-ml-pipeline"
version = "0.1.0"
description = "Pipeline de dados e ML ponta a ponta sobre o Brasileirao Serie A"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Victor Machado", email = "victorhpmachado@gmail.com" }]

dependencies = [
    "requests>=2.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "mlflow>=2.14",
    "typer>=0.12",
    # Serie 1.12: versao suportada e ativa. O pin ~= fixa a minor, entao
    # atualizacoes de patch entram e mudancas de minor exigem decisao explicita.
    "dbt-core~=1.12.0",
    "dbt-duckdb~=1.11.0",
]

# Ferramentas de desenvolvimento: instaladas por `uv sync`, omitidas na
# imagem Docker de execucao via `uv sync --no-dev`.
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "responses>=0.25",
]

[project.scripts]
brasileirao = "brasileirao.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/brasileirao"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
