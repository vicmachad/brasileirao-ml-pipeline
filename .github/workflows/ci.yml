name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

jobs:
  quality:
    name: Lint + testes Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen falha se uv.lock estiver fora de sincronia com pyproject.toml.
      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Pytest
        run: uv run pytest

  dbt:
    name: Build + testes dbt (DuckDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen --no-dev

      - name: dbt deps
        working-directory: dbt
        run: uv run dbt deps

      - name: dbt build (seeds de fixture + modelos + testes)
        working-directory: dbt
        run: uv run dbt build --target ci

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: brasileirao-ml-pipeline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test da imagem
        run: docker run --rm brasileirao-ml-pipeline:ci config
