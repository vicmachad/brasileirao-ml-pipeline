name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DBT_PROFILES_DIR: dbt

jobs:
  quality:
    name: Lint + testes Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Pytest
        run: pytest

  dbt:
    name: Build + testes dbt (DuckDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dbt
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dbt]"

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt build (seeds de fixture + modelos + testes)
        working-directory: dbt
        run: dbt build --target ci
